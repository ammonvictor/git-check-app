name: Release

on:
  push:
    tags: ["v*"]
  # Lets the packaging jobs be exercised without cutting a tag. Publishing is
  # gated on a tag, so a dispatch only produces artifacts.
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in artifact names (default: Cargo.toml)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from an Apple Silicon runner: macos-13 (Intel) is retired.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="git-check-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/git-check" "dist/$name/"
          cp "target/${{ matrix.target }}/release/git-check-tray" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "git-check-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/git-check.exe" "dist/$name/"
          Copy-Item "target/${{ matrix.target }}/release/git-check-tray.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  deb:
    name: debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb -p git-check --output dist/
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    name: macOS .app and .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build a universal tray binary
        run: |
          cargo build --release --locked -p git-check-tray --target aarch64-apple-darwin
          cargo build --release --locked -p git-check-tray --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/git-check-tray \
            target/aarch64-apple-darwin/release/git-check-tray \
            target/x86_64-apple-darwin/release/git-check-tray

      - name: Bundle and package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${VERSION_INPUT:-$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)}"
          fi
          scripts/macos-bundle.sh "$version" target/universal/git-check-tray dist
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --release --locked -p git-check -p git-check-tray

      - name: Build MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist, obj | Out-Null
          $wix = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14\bin"
          & "$wix\candle.exe" -nologo -dVersion=$version -dSourceDir="target\release" -dRepoRoot="." -o obj\git-check.wixobj packaging\windows\git-check.wxs
          & "$wix\light.exe" -nologo -o "dist\git-check-$version-x86_64.msi" obj\git-check.wixobj

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    name: publish release
    needs: [binaries, deb, dmg, msi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
