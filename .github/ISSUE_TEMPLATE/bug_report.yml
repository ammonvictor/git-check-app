name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the version and the exact command —
        most git-check issues come down to how a repository is shaped.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The output you got, pasted verbatim if possible.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should the report, count or exit code have been?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The command you ran, and the relevant shape of the directory: are the
        repositories at the top level, nested, or linked worktrees?
      placeholder: |
        git-check --root ~/code --depth 2
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git-check --version`
      placeholder: git-check 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version`
      placeholder: git version 2.53.0

  - type: textarea
    id: json
    attributes:
      label: JSON output (optional)
      description: |
        `git-check --json` for the affected root, with anything sensitive
        redacted. This makes counts and parsing issues much easier to pin down.
      render: json
