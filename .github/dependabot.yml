version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    ignore:
      # dtolnay/rust-toolchain uses the ref as the *toolchain version*, not an
      # action version: a semver bump asks for a Rust release that may not exist.
      - dependency-name: dtolnay/rust-toolchain
