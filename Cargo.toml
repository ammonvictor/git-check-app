[workspace]
resolver = "2"
members = ["crates/git-check-core", "crates/git-check-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://git.kwano.org/owner/git-check"
authors = ["Ammon Victor <ammon.victor@kwano.org>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
rayon = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
